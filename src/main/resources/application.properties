# ========================================================
# SpendWise Application Properties
# ========================================================
spring.application.name=SpendWise
server.port=8080

# Default DataSource: Persistent File-backed Database with MySQL 8 Compatibility Mode
# (Persists all data to ./data/spendwisedb across restarts)
spring.datasource.url=jdbc:h2:file:./data/spendwisedb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# To switch to a native local MySQL 8 database instance, uncomment the following:
# spring.datasource.url=jdbc:mysql://localhost:3306/spendwise?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.com.spendwise=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

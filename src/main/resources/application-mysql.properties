# ========================================================
# SpendWise MySQL Configuration Profile
# Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/spendwise?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPENDWISE_DB_USERNAME:root}
spring.datasource.password=${SPENDWISE_DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true
